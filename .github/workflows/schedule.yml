name: attendance

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      SKLAND_TOKENS:
        required: true
      SKLAND_NOTIFICATION_URLS:
        required: false
      SKLAND_ANONYMOUS:
        required: false
      MAX_RETRIES:
        required: false
    inputs:
      repository:
        description: The repository to run the workflow on
        default: enpitsuLin/skland-daily-attendance
        required: false
        type: string

jobs:
  attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository || github.repository }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install

      - name: Test ServerChan notification
        env:
          SKLAND_NOTIFICATION_URLS: ${{ secrets.SKLAND_NOTIFICATION_URLS }}
        run: |
          URL="${SKLAND_NOTIFICATION_URLS%%,*}"
          SENDKEY="${URL#schan://}"
          curl -fsS --get "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=GitHub Actions 测试通知" \
            --data-urlencode "desp=如果你收到这条，说明 Server酱和 GitHub Actions 网络都没问题"

      - name: Run daily attendance
        run: pnpm action
        env:
          SKLAND_TOKENS: ${{ secrets.SKLAND_TOKENS }}
          SKLAND_NOTIFICATION_URLS: ${{ secrets.SKLAND_NOTIFICATION_URLS }}
          SKLAND_MAX_RETRIES: ${{ secrets.MAX_RETRIES }}
          SKLAND_ANONYMOUS: ${{ secrets.SKLAND_ANONYMOUS }}
